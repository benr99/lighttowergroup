name: Feed health probe

on:
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: "Hours of feed history used to identify recently active sources"
        required: true
        default: "36"
        type: string
      min_healthy_pct:
        description: "Minimum usable-source percentage required for a passing run"
        required: true
        default: "20"
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install feed probe dependencies
        run: python -m pip install --disable-pip-version-check feedparser requests

      - name: Probe every configured feed
        id: probe
        shell: bash
        env:
          LOOKBACK_HOURS: ${{ inputs.lookback_hours || '36' }}
          MIN_HEALTHY_PCT: ${{ inputs.min_healthy_pct || '20' }}
        run: |
          mkdir -p reports/feed-health
          report="reports/feed-health/source-probe-${GITHUB_RUN_ID}.json"
          echo "report=$report" >> "$GITHUB_OUTPUT"
          python scripts/source_health_probe.py \
            --out "$report" \
            --workers 12 \
            --lookback-hours "$LOOKBACK_HOURS" \
            --min-healthy-pct "$MIN_HEALTHY_PCT"

      - name: Summarize probe
        if: always()
        shell: bash
        env:
          REPORT: ${{ steps.probe.outputs.report }}
        run: |
          if [ -z "$REPORT" ] || [ ! -f "$REPORT" ]; then
            echo "Probe did not produce a report."
            exit 0
          fi
          python - "$REPORT" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import sys
          from collections import Counter

          path = sys.argv[1]
          data = json.load(open(path, encoding="utf-8"))
          rows = data.get("sources", [])
          counts = Counter(row.get("status", "unknown") for row in rows)
          usable = data.get("usable_sources", 0)
          total = data.get("total_sources", len(rows))
          pct = (usable / total * 100) if total else 0
          print("## Feed health probe")
          print(f"- Usable sources: **{usable}/{total} ({pct:.1f}%)**")
          print(f"- Items in lookback window: **{data.get('items_in_window', 0)}**")
          print("- Status counts:")
          for status, count in counts.most_common():
              print(f"  - `{status}`: {count}")
          PY

      - name: Upload feed probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feed-health-${{ github.run_id }}
          path: reports/feed-health/
          if-no-files-found: warn
          retention-days: 30
