name: Curated Insights edition

# The repository scheduler lease in .editorial-state/scheduler.json makes this
# the only active publisher. The legacy Windows task exits without publishing.

on:
  schedule:
    # Two UTC triggers plus the local-hour guard below keep 07:07 New York time
    # through both EDT and EST without a twice-yearly manual cron edit.
    - cron: "7 11 * * *"
    - cron: "7 12 * * *"
  workflow_dispatch: {}

concurrency:
  group: curated-insights-edition
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  TZ: America/New_York
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Enforce the 07:07 New York schedule
        id: schedule
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" && "$(date +%H)" != "07" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping the UTC trigger that does not map to 07:07 America/New_York."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out main
        if: steps.schedule.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        if: steps.schedule.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.lock

      - name: Install locked dependencies
        if: steps.schedule.outputs.skip != 'true'
        run: python -m pip install -r scripts/requirements.lock

      - name: Validate the committed production baseline
        if: steps.schedule.outputs.skip != 'true'
        run: |
          python -m py_compile scripts/*.py
          python -m unittest discover -s tests -v
          python scripts/validate_publication.py
          node --check site.js
          node --check edition.js
          node --check netlify/functions/newsletter-subscribe.js
          node --check netlify/functions/editorial-feedback.js
          node --test tests/netlify-functions.test.js

      - name: Configure the publication identity
        if: steps.schedule.outputs.skip != 'true'
        run: |
          git config user.name "LTG Editorial Desk"
          git config user.email "actions@lighttowergroup.co"

      - name: Build the curated edition
        if: steps.schedule.outputs.skip != 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        working-directory: scripts
        run: >-
          python daily_news_agent.py
          --selection-mode edition
          --articles 4
          --skip-git
          --run-origin github-actions

      - name: Validate the generated edition before deployment
        if: steps.schedule.outputs.skip != 'true'
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate_publication.py
          node --test tests/netlify-functions.test.js

      - name: Write the edition report
        if: steps.schedule.outputs.skip != 'true'
        shell: bash
        run: |
          if [[ -f .editorial-state/run-summary.md ]]; then
            cat .editorial-state/run-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "# Light Tower Insights edition" >> "$GITHUB_STEP_SUMMARY"
            echo "The run did not produce an editorial summary." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Preserve editorial evidence and diagnostics
        if: always() && steps.schedule.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: insights-edition-${{ github.run_id }}
          path: |
            .editorial-state/
            latest-edition.json
            editions/
            scripts/agent_log.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Resolve automatic publication or editorial review
        if: steps.schedule.outputs.skip != 'true'
        id: publication
        shell: bash
        run: |
          REVIEW="$(python -c "import json; print(str(json.load(open('.editorial-state/publication-decision.json'))['review_required']).lower())")"
          echo "review=$REVIEW" >> "$GITHUB_OUTPUT"
          if [[ "$REVIEW" == "true" ]]; then
            echo "branch=codex/editorial-review-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          else
            echo "branch=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the validated generated files
        if: steps.schedule.outputs.skip != 'true'
        run: >-
          python scripts/publish_generated.py
          --branch "${{ steps.publication.outputs.branch }}"
          --message "Publish curated Insights edition ${{ github.run_id }}"

      - name: Open the editorial review
        if: steps.schedule.outputs.skip != 'true' && steps.publication.outputs.review == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr create \
            --base main \
            --head "${{ steps.publication.outputs.branch }}" \
            --title "Editorial review: curated Insights edition" \
            --body-file .editorial-state/run-summary.md
