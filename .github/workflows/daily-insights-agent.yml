name: Curated Insights edition

# The repository scheduler lease in .editorial-state/scheduler.json makes this
# the only active publisher. The legacy Windows task exits without publishing.

on:
  schedule:
    # Two UTC triggers plus the nominal-schedule guard below keep 07:07 New York
    # time through both EDT and EST without a twice-yearly manual cron edit.
    - cron: "7 11 * * *"
    - cron: "7 12 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run depth: score only, generate a no-write preview, or publish"
        required: true
        default: "shadow"
        type: choice
        options:
          - shadow
          - preview
          - publish
      article_count:
        description: "Maximum articles to generate (scheduled runs retain the five-candidate ceiling)"
        required: true
        default: "3"
        type: choice
        options:
          - "1"
          - "3"
          - "5"

concurrency:
  group: curated-insights-edition
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  TZ: America/New_York
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out the scheduled or release ref
        uses: actions/checkout@v7
        with:
          # Scheduled runs always use main. Manual release gates may select a
          # remediation branch so the exact candidate code can be exercised
          # before it is merged.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || 'main' }}
          fetch-depth: 0

      - name: Resolve the trigger policy
        id: policy
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_CRON: ${{ github.event.schedule }}
          DISPATCH_MODE: ${{ inputs.mode }}
        run: |
          python scripts/resolve_schedule_policy.py \
            --event-name "$EVENT_NAME" \
            --trigger-cron "$TRIGGER_CRON" \
            --dispatch-mode "$DISPATCH_MODE" >> "$GITHUB_OUTPUT"

      - name: Report schedule-guard skip
        if: steps.policy.outputs.skip == 'true'
        shell: bash
        run: |
          echo "# Light Tower Insights schedule guard" >> "$GITHUB_STEP_SUMMARY"
          echo "This invocation was intentionally skipped because it is the inactive daylight-saving-time cron trigger." >> "$GITHUB_STEP_SUMMARY"
          echo "No provider check, generation, publication, or deployment was attempted." >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        if: steps.policy.outputs.skip != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.lock

      - name: Install locked dependencies
        if: steps.policy.outputs.skip != 'true'
        run: python -m pip install -r scripts/requirements.lock

      - name: Validate the committed production baseline
        if: steps.policy.outputs.skip != 'true'
        run: |
          python -m py_compile scripts/*.py
          python -m unittest discover -s tests -v
          python scripts/validate_publication.py
          node --check site.js
          node --check edition.js
          node --check netlify/functions/newsletter-subscribe.js
          node --check netlify/functions/editorial-feedback.js
          node --test tests/netlify-functions.test.js

      - name: Preflight the configured writing provider
        if: steps.policy.outputs.skip != 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-v4-pro
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/model_router.py

      - name: Configure the publication identity
        if: steps.policy.outputs.skip != 'true'
        run: |
          git config user.name "LTG Editorial Desk"
          git config user.email "actions@lighttowergroup.co"

      - name: Build the curated edition
        if: steps.policy.outputs.skip != 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-v4-pro
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          RUN_MODE: ${{ steps.policy.outputs.mode }}
          ARTICLE_COUNT: ${{ inputs.article_count || '5' }}
        working-directory: scripts
        shell: bash
        run: |
          args=(
            --selection-mode edition
            --articles "$ARTICLE_COUNT"
            --daily-target 3
            --pipeline-v2
            --shadow-v3
            --skip-git
            --run-origin github-actions
          )
          case "$RUN_MODE" in
            shadow) args+=(--shadow) ;;
            preview) args+=(--dry-run) ;;
            publish) ;;
            *) echo "Unsupported run mode: $RUN_MODE" >&2; exit 2 ;;
          esac
          python daily_news_agent.py "${args[@]}"

      - name: Validate the generated edition before deployment
        if: steps.policy.outputs.skip != 'true' && steps.policy.outputs.mode == 'publish'
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate_publication.py
          node --test tests/netlify-functions.test.js

      - name: Write the edition report
        if: steps.policy.outputs.skip != 'true'
        shell: bash
        run: |
          if [[ -f .editorial-state/run-summary.md ]]; then
            cat .editorial-state/run-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "# Light Tower Insights edition" >> "$GITHUB_STEP_SUMMARY"
            echo "The ${{ steps.policy.outputs.mode }} run completed without changing public files." >> "$GITHUB_STEP_SUMMARY"
            echo "See the build log and retained editorial artifact for the full output." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Preserve editorial evidence and diagnostics
        if: always() && steps.policy.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: insights-edition-${{ github.run_id }}
          path: |
            .editorial-state/
            latest-edition.json
            editions/
            scripts/agent_log.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 30

      - name: Resolve automatic publication or editorial review
        if: steps.policy.outputs.skip != 'true' && steps.policy.outputs.mode == 'publish'
        id: publication
        shell: bash
        run: |
          REVIEW="$(python -c "import json; print(str(json.load(open('.editorial-state/publication-decision.json'))['review_required']).lower())")"
          echo "review=$REVIEW" >> "$GITHUB_OUTPUT"
          if [[ "$REVIEW" == "true" ]]; then
            echo "branch=codex/editorial-review-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          else
            echo "branch=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the validated generated files
        if: steps.policy.outputs.skip != 'true' && steps.policy.outputs.mode == 'publish'
        run: >-
          python scripts/publish_generated.py
          --branch "${{ steps.publication.outputs.branch }}"
          --message "Publish curated Insights edition ${{ github.run_id }}"

      - name: Open the editorial review
        if: >-
          steps.policy.outputs.skip != 'true' &&
          steps.policy.outputs.mode == 'publish' &&
          steps.publication.outputs.review == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr create \
            --base main \
            --head "${{ steps.publication.outputs.branch }}" \
            --title "Editorial review: curated Insights edition" \
            --body-file .editorial-state/run-summary.md
