[build]
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions."analytics-retention"]
  schedule = "@daily"

[[redirects]]
  from   = "/command-center"
  to     = "/analytics-dashboard.html"
  status = 200
  force  = true

[[redirects]]
  from   = "/linkedin_essay_queue.json"
  to     = "/"
  status = 404
  force  = true

[[redirects]]
  from   = "/ideas/"
  to     = "/ideas.html"
  status = 301
  force  = true

[[redirects]]
  from   = "/ideas/_drafts/*"
  to     = "/"
  status = 404
  force  = true

# Canonicalize a duplicate article without breaking existing inbound links.
[[redirects]]
  from   = "/insights/construction-loan-fiDi-rental-tower.html"
  to     = "/insights/grubb-fidi-construction-loan.html"
  status = 301
  force  = true

[[redirects]]
  from   = "/insights/construction-loan-fidi-rental-tower.html"
  to     = "/insights/grubb-fidi-construction-loan.html"
  status = 301
  force  = true

# Block public access to internal tools
[[redirects]]
  from   = "/origination.html"
  to     = "/"
  status = 404
  force  = true

[[redirects]]
  from   = "/insights-admin.html"
  to     = "/"
  status = 404
  force  = true

[[redirects]]
  from   = "/data/*"
  to     = "/"
  status = 404
  force  = true

[[redirects]]
  from   = "/.editorial-state/*"
  to     = "/"
  status = 404
  force  = true

[[redirects]]
  from   = "/agent/*"
  to     = "/"
  status = 404
  force  = true

[[redirects]]
  from   = "/memory/*"
  to     = "/"
  status = 404
  force  = true

[[redirects]]
  from   = "/scripts/*"
  to     = "/"
  status = 404
  force  = true

# Force HTTPS
[[redirects]]
  from   = "http://lighttowergroup.co/*"
  to     = "https://lighttowergroup.co/:splat"
  status = 301
  force  = true

[[redirects]]
  from   = "http://www.lighttowergroup.co/*"
  to     = "https://lighttowergroup.co/:splat"
  status = 301
  force  = true

# Security headers (all pages)
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent MIME-type sniffing
    X-Content-Type-Options = "nosniff"

    # Clickjacking, also reinforced by CSP frame-ancestors below
    X-Frame-Options = "DENY"

    # Don't leak full referring URL to third parties
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Disable browser features not used by this site
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"

    # Force HTTPS for 2 years; include subdomains; eligible for browser preload list
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

    # Content Security Policy
    # - script-src: main site has no inline scripts; unsafe-inline added for /insights/* path below
    # - Existing insight articles (331 pages) have legacy inline scripts — path override handles this
    # - New articles generated by render_html() use external site.js only
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https: data:; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests;"

# CSP override for insights article pages — existing 331 articles have legacy inline scripts
[[headers]]
  for = "/insights/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https: data:; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests;"

# Cache static assets aggressively
[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/chat-widget.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/site.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/site.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/visitor-analytics.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/analytics-dashboard.html"
  [headers.values]
    Cache-Control = "private, no-store, max-age=0"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://identity.netlify.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://identity.netlify.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none';"

[[headers]]
  for = "/command-center"
  [headers.values]
    Cache-Control = "private, no-store, max-age=0"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://identity.netlify.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://identity.netlify.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none';"

[[headers]]
  for = "/analytics-dashboard.js"
  [headers.values]
    Cache-Control = "private, no-store, max-age=0"

[[headers]]
  for = "/analytics-dashboard.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/capital-diagnostic.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/capital-diagnostic.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/edition.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/edition.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/latest-edition.json"
  [headers.values]
    Cache-Control = "public, max-age=60, must-revalidate"

[[headers]]
  for = "/editions/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.pdf"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/insights/*.png"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/insights/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/insights/*.pdf"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/insights.json"
  [headers.values]
    Cache-Control = "public, max-age=60, must-revalidate"

[[headers]]
  for = "/feed.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

# Netlify functions: no caching
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"
